services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crnproductapi-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crnproductapi-webapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CRNProductDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - Jwt__SecretKey=ProductionOnlySecretKeyChangeThisUsingEnvironmentVariables12345!
      - Jwt__Issuer=CRNProductApi
      - Jwt__Audience=CRNProductApiClient
    ports:
      - "5225:80"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver_data:
